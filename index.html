<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joan's Camera Toggle</title>
  <style>
    body {
      font-family: Verdana, sans-serif;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }

    .label {
      font-size: 24px;
      margin-right: 20px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 160px;
      height: 68px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 68px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 60px;
      width: 60px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #28a745;
    }

    input:checked+.slider:before {
      transform: translateX(96px);
    }

    .slider.round {
      border-radius: 68px;
    }

    .slider.round:before {
      border-radius: 50%;
    }

    #lookAtMeButton {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      font-family: Verdana, sans-serif;
    }

    body.blinking {
      animation: blink 0.5s alternate infinite;
    }

    body.warning {
      background-color: red;
    }

    @keyframes blink {
      0% {
        background-color: red;
      }

      100% {
        background-color: black;
      }
    }
  </style>

  <!-- Firebase Configuration -->
  <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-database-compat.js"></script>
</head>

<body>

  <!-- Existing toggle and Look at me button -->
  <div class="container">
    <span class="label">Joan's Camera 3</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch">
      <span class="slider round"></span>
    </label>
  </div>

  <div class="container">
    <button id="lookAtMeButton">Look at me</button>
  </div>

  <!-- New Warning toggle -->
  <div class="container">
    <span class="label">Warning</span>
    <label class="switch">
      <input type="checkbox" id="warningToggle">
      <span class="slider round"></span>
    </label>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAYHKXIb37orJ7uofmdaN4OG-T0Ce-ZHv0",
      authDomain: "multicam-8bb9e.firebaseapp.com",
      databaseURL: "https://multicam-8bb9e-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "multicam-8bb9e",
      storageBucket: "multicam-8bb9e.appspot.com",
      messagingSenderId: "434917041062",
      appId: "1:434917041062:web:f6fb6ed0f2e34967582567"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const toggleSwitch = document.getElementById('toggleSwitch');
    const lookAtMeButton = document.getElementById('lookAtMeButton');
    const warningToggle = document.getElementById('warningToggle');

    const sliderStateRef = database.ref('sliderState');
    const blinkStateRef = database.ref('blinkState');
    const warningStateRef = database.ref('warningState');

    const getReadyAudio = new Audio('getReady.mp3');
    const notLiveAudio = new Audio('notLive.mp3');
    let isFirstLoad = true;

    // Sync slider state with Firebase
    sliderStateRef.on('value', (snapshot) => {
      const sliderState = snapshot.val();

      // Play audio on state change, but skip the first load to avoid autoplay issues/unwanted noise
      if (!isFirstLoad) {
        if (sliderState === "on") {
          getReadyAudio.play().catch(e => console.log("Audio play failed (maybe autoplay policy?):", e));
        } else {
          notLiveAudio.play().catch(e => console.log("Audio play failed (maybe autoplay policy?):", e));
        }
      }

      toggleSwitch.checked = sliderState === "on";

      if (sliderState === "on") {
        document.body.classList.add('blinking');
      } else {
        document.body.classList.remove('blinking');
      }

      isFirstLoad = false;
    });

    // Sync blinking state with Firebase
    blinkStateRef.on('value', (snapshot) => {
      const blinkState = snapshot.val();

      if (blinkState === true) {
        document.body.classList.add('blinking');
        setTimeout(() => {
          document.body.classList.remove('blinking');
          blinkStateRef.set(false); // Reset blink state
        }, 5000);
      }
    });

    // Sync warning state with Firebase
    warningStateRef.on('value', (snapshot) => {
      const warningState = snapshot.val();
      warningToggle.checked = warningState === "on";

      if (warningState === "on") {
        document.body.classList.add('warning');
      } else {
        document.body.classList.remove('warning');
      }
    });

    // Update slider state in Firebase
    toggleSwitch.addEventListener('change', function () {
      const newState = this.checked ? "on" : "off";
      sliderStateRef.set(newState);
    });

    // Trigger blinking state in Firebase
    lookAtMeButton.addEventListener('click', function () {
      blinkStateRef.set(true);
    });

    // Update warning state in Firebase
    warningToggle.addEventListener('change', function () {
      const newState = this.checked ? "on" : "off";
      warningStateRef.set(newState);
    });
  </script>

</body>

</html>
