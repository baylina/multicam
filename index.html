<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joan's Camera Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Configuration -->
  <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-database-compat.js"></script>
</head>

<body>

  <div class="control-deck">

    <!-- Main Camera Toggle -->
    <div class="row">
      <div>
        <div class="label">Joan's Camera 41</div>
        <span class="status-indicator">Main Feed Control</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <!-- Walkie Talkie PTT -->
    <div class="row" style="justify-content: center; flex-direction: column; gap: 10px;">
      <button id="pttButton">🎙️ Hold to Talk</button>
      <span id="pttStatus" class="status-indicator" style="text-align: center;">Channel Ready</span>
    </div>

  </div>
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAYHKXIb37orJ7uofmdaN4OG-T0Ce-ZHv0",
      authDomain: "multicam-8bb9e.firebaseapp.com",
      databaseURL: "https://multicam-8bb9e-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "multicam-8bb9e",
      storageBucket: "multicam-8bb9e.appspot.com",
      messagingSenderId: "434917041062",
      appId: "1:434917041062:web:f6fb6ed0f2e34967582567"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const toggleSwitch = document.getElementById('toggleSwitch');
    const pttButton = document.getElementById('pttButton');
    const pttStatus = document.getElementById('pttStatus');

    const sliderStateRef = database.ref('sliderState');
    const walkieStatusRef = database.ref('walkieTalkie/status');
    const walkieStreamRef = database.ref('walkieTalkie/stream');

    const getReadyAudio = new Audio('getReady.mp3');
    const notLiveAudio = new Audio('notLive.mp3');
    let isFirstLoad = true;

    // --- Walkie Talkie Logic ---
    const myUserId = 'user_' + Math.random().toString(36).substr(2, 9);

    // --- Detect iOS/Safari for compatibility ---
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    // --- GLOBAL AUDIO INIT (Fixed Context & Receiver) ---
    // Persistent AudioContext to avoid sample-rate mismatches
    // On Mac/PC: FORCE 44.1kHz (native support) to avoid JS resampling artifacts
    // On iOS: Use default (48kHz) and resample via JS (Safari doesn't support forcing rate)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctxOptions = isIOS ? {} : { sampleRate: 44100 };
    const audioCtx = new AudioContext(ctxOptions);

    // Persistent Receiver Audio Object (for iOS Autoplay policy)
    // We "bless" this object on the first user interaction (Unlock Button)
    const receiverAudio = new Audio();
    receiverAudio.setAttribute('playsinline', 'true'); // Helpful for iOS

    let audioRecorder = null;
    let isRecording = false;

    // UI Styles for PTT
    const updatePttUI = (state, who) => {
      pttButton.style.transition = 'all 0.2s';
      if (state === 'idle') {
        pttButton.disabled = false;
        pttButton.innerText = "🎙️ Hold to Talk";
        pttButton.style.background = "#333";
        pttButton.style.color = "#fff";
        pttButton.style.opacity = "1";
        pttStatus.innerText = "Channel Ready";
        pttStatus.style.color = "#a0a0a0";
      } else if (state === 'talking') {
        pttButton.disabled = false;
        pttButton.innerText = "Transmitting...";
        pttButton.style.background = "#ff3d00"; // Red
        pttButton.style.color = "white";
        pttStatus.innerText = "You are live";
        pttStatus.style.color = "#ff3d00";
      } else if (state === 'busy') {
        pttButton.disabled = true;
        pttButton.innerText = "Channel Busy";
        pttButton.style.background = "#1a1a1a";
        pttButton.style.opacity = "0.5";
        pttStatus.innerText = `${who || 'Someone'} is talking...`;
        pttStatus.style.color = "#00fa9a";
      }
    };

    // Setup CSS for PTT Button dynamically
    // Base styles are now in style.css (#pttButton)

    // 1. Listen to Channel Status (Mutex) & Auto-Reset Hung Channel
    walkieStatusRef.on('value', (snapshot) => {
      const status = snapshot.val();
      // AUTO-RESET: If channel is busy for > 30 seconds
      if (status && (Date.now() - status.timestamp > 30000)) {
        console.log("⚠️ Channel timed out! Resetting...");
        walkieStatusRef.set(null);
        return;
      }
      if (!status) {
        updatePttUI('idle');
      } else if (status.user === myUserId) {
        updatePttUI('talking');
      } else {
        updatePttUI('busy', "Someone");
      }
    });

    // --- CUSTOM WAV RECORDER (Uses Global Context) ---
    class AudioRecorder {
      constructor(context) {
        this.context = context;
        this.mediaStream = null;
        this.scriptProcessor = null;
        this.inputSource = null;
        this.chunks = [];
        this.isRecording = false;
        this.sampleRate = this.context.sampleRate;
        this.onStop = null;
      }

      async start() {
        if (this.context.state === 'suspended') {
          await this.context.resume();
        }
        this.sampleRate = this.context.sampleRate;
        console.log("Recorder started. Rate:", this.sampleRate);

        this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        this.inputSource = this.context.createMediaStreamSource(this.mediaStream);

        // bufferSize: 4096 
        this.scriptProcessor = this.context.createScriptProcessor(4096, 1, 1);
        this.chunks = [];
        this.isRecording = true;

        this.scriptProcessor.onaudioprocess = (e) => {
          if (!this.isRecording) return;
          const inputData = e.inputBuffer.getChannelData(0);
          this.chunks.push(new Float32Array(inputData));
        };

        this.inputSource.connect(this.scriptProcessor);
        this.scriptProcessor.connect(this.context.destination);
      }

      stop() {
        this.isRecording = false;
        // Stop stream but DO NOT close global context
        if (this.mediaStream) this.mediaStream.getTracks().forEach(t => t.stop());
        if (this.scriptProcessor) this.scriptProcessor.disconnect();
        if (this.inputSource) this.inputSource.disconnect();

        // Merge chunks
        const length = this.chunks.reduce((acc, chunk) => acc + chunk.length, 0);
        const buffer = new Float32Array(length);
        let offset = 0;
        for (const chunk of this.chunks) {
          buffer.set(chunk, offset);
          offset += chunk.length;
        }

        // RESAMPLE if needed (e.g., 48kHz -> 44.1kHz for iPhone)
        const targetSampleRate = 44100;
        let finalBuffer = buffer;

        if (this.sampleRate !== targetSampleRate) {
          console.log(`⚙️ Resampling ${this.sampleRate}Hz -> ${targetSampleRate}Hz`);
          finalBuffer = this.resample(buffer, this.sampleRate, targetSampleRate);
        }

        const wavBlob = this.encodeWAV(finalBuffer, targetSampleRate);
        if (this.onStop) this.onStop(wavBlob);
      }

      // Linear interpolation resampling
      resample(buffer, fromRate, toRate) {
        if (fromRate === toRate) return buffer;

        const ratio = fromRate / toRate;
        const newLength = Math.round(buffer.length / ratio);
        const result = new Float32Array(newLength);

        for (let i = 0; i < newLength; i++) {
          const srcIndex = i * ratio;
          const srcIndexFloor = Math.floor(srcIndex);
          const srcIndexCeil = Math.min(srcIndexFloor + 1, buffer.length - 1);
          const t = srcIndex - srcIndexFloor;

          // Linear interpolation
          result[i] = buffer[srcIndexFloor] * (1 - t) + buffer[srcIndexCeil] * t;
        }

        return result;
      }

      encodeWAV(samples, sampleRate = 44100) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);

        this.writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        this.writeString(view, 8, 'WAVE');
        this.writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM
        view.setUint16(22, 1, true); // Mono
        view.setUint32(24, sampleRate, true); // Use provided sample rate
        view.setUint32(28, sampleRate * 2, true); // Byte rate
        view.setUint16(32, 2, true); // Block align
        view.setUint16(34, 16, true); // Bits per sample
        this.writeString(view, 36, 'data');
        view.setUint32(40, samples.length * 2, true);
        this.floatTo16BitPCM(view, 44, samples);
        return new Blob([view], { type: 'audio/wav' });
      }

      floatTo16BitPCM(output, offset, input) {
        for (let i = 0; i < input.length; i++, offset += 2) {
          const s = Math.max(-1, Math.min(1, input[i]));
          output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
      }

      writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }
    }

    // --- Detect iOS/Safari for compatibility ---

    if (isIOS) {
      pttStatus.innerText = "iOS Mode (Offline)";
    } else {
      pttStatus.innerText = "Offline Mode (WAV Sender)";
    }

    // 2. Play Audio Stream (Receiver) - USES GLOBAL RECEIVER
    walkieStreamRef.on('child_added', (snapshot) => {
      const data = snapshot.val();

      if (data.user !== myUserId) {
        console.log("✅ Audio received...");

        let rawMime = data.mimeType || 'audio/wav';
        const simpleMime = rawMime.split(';')[0];
        const dataUrl = 'data:' + simpleMime + ';base64,' + data.audio;

        // USE GLOBAL RECEIVER
        receiverAudio.src = dataUrl;
        receiverAudio.onloadeddata = () => {
          pttStatus.innerText = "Receiving Message...";
        };

        receiverAudio.play()
          .then(() => {
            console.log("✅ Audio playing!");
            setTimeout(() => pttStatus.innerText = "Channel Ready", 2000);
          })
          .catch(e => {
            console.error("❌ Audio play error:", e);
            console.error("Error details:", e.message, e.name);
            pttStatus.innerText = "Tap Hold to Talk first";
            pttStatus.style.color = "#ff9800";
          });
      }
    });

    // 3. Start Recording Logic (Uses Global audioCtx)
    let hasTriedAutoUnlock = false;

    const initAndStartRecording = async () => {
      try {
        console.log("🎙️ Initializing Audio Recorder...");

        // Auto-unlock audio on FIRST PTT press (user gesture)
        if (!hasTriedAutoUnlock) {
          hasTriedAutoUnlock = true;
          try {
            if (audioCtx.state === 'suspended') {
              await audioCtx.resume();
            }
            // Also try to "bless" receiver audio silently with valid WAV (PCM 16bit 44.1kHz Mono)
            receiverAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
            await receiverAudio.play();
            receiverAudio.pause();
            console.log("✅ Auto-unlocked audio on first PTT");
          } catch (e) {
            console.log("Auto-unlock failed, may need manual unlock:", e);
          }
        }

        // Ensure Global Context is Running
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        if (!audioRecorder) {
          // Pass global context
          audioRecorder = new AudioRecorder(audioCtx);
        }

        // SAFETY CHECK: If user released button while waiting for permissions, ABORT
        if (!isPttPressed) {
          console.log("⚠️ Button released during init - Aborting recording");
          return;
        }

        await audioRecorder.start();
        console.log("✅ Audio Context Started");

        // Double check after start
        if (!isPttPressed) {
          audioRecorder.stop();
          return;
        }

        // Now request lock
        walkieStatusRef.transaction((current) => {
          if (current === null) {
            return { user: myUserId, timestamp: Date.now() };
          } else {
            return;
          }
        }, (error, committed) => {
          if (committed) {
            isRecording = true;
          } else {
            console.log("❌ Could not get lock, stopping");
            audioRecorder.stop();
          }
        });

      } catch (err) {
        console.error("Mic error:", err);
        alert("Microphone access required");
      }
    };

    const stopTalk = () => {
      if (audioRecorder && isRecording) {
        console.log("🛑 Stopping recording...");
        audioRecorder.onStop = (wavBlob) => {
          console.log("🛑 Recording stopped. Size:", wavBlob.size);
          if (wavBlob.size < 1000) return;

          const reader = new FileReader();
          reader.readAsDataURL(wavBlob);
          reader.onloadend = () => {
            const base64Audio = reader.result.split(',')[1];
            walkieStreamRef.push({
              user: myUserId,
              audio: base64Audio,
              mimeType: 'audio/wav',
              timestamp: Date.now()
            });
          };
        };
        audioRecorder.stop();
        isRecording = false;
      }
      walkieStatusRef.set(null);
      walkieStreamRef.remove();
    };

    // --- STRICT PTT LOGIC ---
    let isPttPressed = false;

    // Bind Events (Mouse & Touch)
    const startPtt = (e) => {
      e.preventDefault(); // Prevent ghost clicks
      if (isPttPressed) return;
      isPttPressed = true;
      initAndStartRecording();
    };

    const stopPtt = (e) => {
      // DO NOT preventDefault here, or you block slider/clicks elsewhere!
      isPttPressed = false;
      if (isRecording || audioRecorder) stopTalk();
    };

    pttButton.addEventListener('mousedown', startPtt);
    pttButton.addEventListener('touchstart', startPtt);

    // Stop on ANY release/cancel/leave
    window.addEventListener('mouseup', stopPtt);
    window.addEventListener('touchend', stopPtt);
    window.addEventListener('touchcancel', stopPtt);
    // Safety: if mouse leaves window while held
    window.addEventListener('mouseleave', stopPtt);

    // --- Slider Logic ---

    // Sync slider state with Firebase
    // Sync slider state with Firebase
    sliderStateRef.on('value', (snapshot) => {
      const sliderState = snapshot.val();
      console.log("🔄 Slider synced from DB:", sliderState);

      // Play audio on state change, but skip the first load to avoid autoplay issues/unwanted noise
      if (!isFirstLoad) {
        if (sliderState === "on") {
          getReadyAudio.play().catch(e => console.log("Audio play failed:", e));
        } else {
          notLiveAudio.play().catch(e => console.log("Audio play failed:", e));
        }
      }

      toggleSwitch.checked = sliderState === "on";

      if (sliderState === "on") {
        document.body.classList.add('blinking');
      } else {
        document.body.classList.remove('blinking');
      }

      isFirstLoad = false;
    });

    // Update slider state in Firebase
    toggleSwitch.addEventListener('change', function () {
      const newState = this.checked ? "on" : "off";
      console.log("🎚️ Slider changed manually to:", newState);
      sliderStateRef.set(newState);
    });

    // --- GLOBAL SILENT UNLOCK (UX Improvement) ---
    // Attempts to unlock audio context and receiver audio on the VERY FIRST interaction
    // anywhere on the page (e.g. toggling slider, tapping background).
    // This removes the need for explicit "Unlock" buttons or waiting for PTT.
    const silentUnlock = async () => {
      console.log("👆 User interaction detected: Attempting silent audio unlock...");

      // 1. Resume Global Context
      if (audioCtx.state === 'suspended') {
        try {
          await audioCtx.resume();
          console.log("✅ Global AudioContext Resumed");
        } catch (e) {
          console.warn("⚠️ AudioContext resume failed:", e);
        }
      }

      // 2. Bless Receiver Audio (with valid silent WAV)
      try {
        if (receiverAudio.paused) {
          receiverAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
          await receiverAudio.play();
          // Important: Don't pause immediately, let it play the tiny silence to fully "bless" it
          console.log("✅ Receiver Audio Blessed (Silent)");
        }
      } catch (e) {
        console.warn("⚠️ Receiver bless failed (maybe already playing?):", e);
      }

      // 3. Unlock Sound Effects
      const unlockFx = (audioObj) => {
        if (audioObj) {
          audioObj.muted = true;
          audioObj.play().then(() => {
            audioObj.pause();
            audioObj.currentTime = 0;
            audioObj.muted = false;
          }).catch(() => { });
        }
      };
      unlockFx(getReadyAudio);
      unlockFx(notLiveAudio);

      // Remove listeners so this only runs ONCE
      window.removeEventListener('click', silentUnlock);
      window.removeEventListener('touchstart', silentUnlock);
      window.removeEventListener('keydown', silentUnlock);
    };

    // Attach global listeners
    window.addEventListener('click', silentUnlock);
    window.addEventListener('touchstart', silentUnlock);
    window.addEventListener('keydown', silentUnlock);

  </script>

</body>

</html>
